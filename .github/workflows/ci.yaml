name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mods/package-lock.json
            service/package-lock.json

      - name: Build and test userscript
        working-directory: mods
        run: |
          npm ci
          npm run build
          node --experimental-vm-modules --test tests/*.test.js

      - name: Build DIAL service
        working-directory: service
        run: |
          npm ci
          npx rollup -c rollup.config.js

      # TizenBrew loads dist/ straight from the repository, so keep it in sync with the sources.
      - name: Commit rebuilt dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "build: update dist [skip ci]"
            git push
          fi
