name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into a sync branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/reisxd/TizenTube.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git checkout -B upstream-sync
          if git merge --no-edit upstream/main; then
            git push -f origin upstream-sync
            gh pr create --base main --head upstream-sync \
              --title "Sync with upstream reisxd/TizenTube" \
              --body "Automated weekly merge of upstream main. CI must pass before merging." || true
          else
            echo "Merge conflicts: resolve locally with docs/MAINTAINING.md."
            exit 1
          fi
